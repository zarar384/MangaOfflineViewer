<div class="tabs-row">
  <div class="tabs-left">
    <molv-tabs
      [userTabs]="visibleTabs()"
      [selectedUserTab]="selectedMangaId()"
      (homeClicked)="goHome()"
      (tabSelected)="onTabSelected($event)"
      (tabClosed)="onTabClosed($event)"
    />
  </div>

  <div class="tabs-right">
    <button class="molv-btn molv-btn-pink" (click)="openUploadWindow()">
      {{ 'uploadFiles' | transloco }}
    </button>
  </div>
</div>
