<div class="tabs-row">
  <div class="tabs-left">
    <molv-tabs
      [tabs]="visibleTabs()"
      [selectedTab]="selectedChapter"
      (homeClicked)="goHome()"
      (tabSelected)="onTabSelected($event)"
      (tabClosed)="onTabClosed($event)"
    />
  </div>

  <div class="tabs-right">
    <button class="molv-btn-gradient" (click)="openUploadWindow()">
      Upload Files
    </button>
  </div>
</div>
