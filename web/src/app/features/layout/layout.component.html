<div class="app-shell">

  <app-manga-navbar [activeManga]="selectedMangaId" (mangaSelected)="onMangaSelected($event)"
    (openUploadWindowClicked)="onOpenUploadWindowClicked()">
  </app-manga-navbar>


<div class="content" [class.reader-active]="viewMode === ViewMod.Single">
    @if(viewMode === ViewMod.Home)
    {
    <app-manga-home [activeManga]="selectedMangaId" (mangaSelected)="onMangaSelected($event)">
    </app-manga-home>
    }

    @if(viewMode === ViewMod.Chapters)
    {
    <manga-page [activeManga]="selectedMangaId">
    </manga-page>
    }

  @if(viewMode === ViewMod.Single)
  {
  <app-manga-reader [activeManga]="selectedMangaId">
  </app-manga-reader>
  }
  </div>

  <upload-file-window [isVisible]="showUploadWindow()" [tabId]="selectedMangaId" [viewMode]="viewMode"
    (closeWindow)="onUploadWindowClose()"></upload-file-window>
</div>
