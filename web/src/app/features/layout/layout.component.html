<div class="app-shell">
  <app-manga-navbar [activeManga]="selectedMangaId" (mangaSelected)="selectedMangaId = $event">
  </app-manga-navbar>

  @if(!selectedMangaId)
  {
    <app-manga-home [activeManga]="selectedMangaId" (mangaSelected)="selectedMangaId = $event">
    </app-manga-home>
  }
  @else{
    <app-manga-reader [activeManga]="selectedMangaId"></app-manga-reader>
  }
</div>
