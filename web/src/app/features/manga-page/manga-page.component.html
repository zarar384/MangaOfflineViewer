<div class="manga-page">

  <div class="manga-header">

    <div class="cover">
      <img [src]="tab?.preview" />
    </div>

    <div class="info">

      <!-- title -->
      @if (!isEditMode()) {
        <h1 class="title">{{ tab?.name }}</h1>
      }
      @else {
        <input [(ngModel)]="editModel!.name" (ngModelChange)="onNameChange($event)" type="text" class="molv-txtbx molv-txtbx-large" placeholder="Title" />
      }

      <!-- description -->
      @if (!isEditMode()) {
        <p class="description">{{ tab?.description }}</p>
      }
      @else {
        <textarea [(ngModel)]="editModel!.description" (ngModelChange)="onDescriptionChange($event)" type="text" class="molv-txtbx molv-txtbx-large"  placeholder="Description"> </textarea>
      }

      <!-- buttons -->
      <div class="actions">
        @if (!isEditMode()) {
          <button class="molv-btn molv-btn-orange" (click)="edit()">{{ 'edit' | transloco }}</button>
        }
        @else {
          <button class="molv-btn molv-btn-pink" (click)="cancel()">{{ 'cancel' | transloco }}</button>
          <button class="molv-btn molv-btn-green" (click)="save()">{{ 'save' | transloco }}</button>
          <button class="molv-btn molv-btn-red" (click)="delete()">{{ 'delete' | transloco }}</button>
        }
      </div>
    </div>
  </div>

  <movl-chapter-list [activeManga]="activeManga" [isEditMode]="isEditMode()"></movl-chapter-list>
</div>
