<div class="manga-page">

  <div class="manga-header">

    <div class="card">
      <div class="cover">
        <img [src]="previewUrl()" />
      </div>
      @if (isEditMode()) {
      <div class="header">
        <button class="molv-btn molv-btn-orange" (click)="fileInput.click()">{{ 'change' | transloco }}</button>

        <input #fileInput type="file" accept="image/*" hidden (change)="onFileSelected($event)" />
      </div>
      }

    </div>

    <div class="info">

      <!-- title -->
      @if (!isEditMode()) {
      <h1 class="title">{{ tab()?.name }}</h1>
      }
      @else {
      <input [(ngModel)]="draft!.name" (ngModelChange)="onNameChange($event)" type="text"
        class="molv-txtbx molv-txtbx-large" placeholder="{{ 'title' | transloco }}" />
      }

      <!-- description -->
      @if (!isEditMode()) {
      <p class="description">{{ tab()?.description }}</p>
      }
      @else {
      <textarea [(ngModel)]="draft!.description" (ngModelChange)="onDescriptionChange($event)" type="text"
        class="molv-txtbx molv-txtbx-large" placeholder="{{ 'description' | transloco }}"> </textarea>
      }

      <!-- buttons -->
      <div class="actions">
        @if (!isEditMode()) {
        <button class="molv-btn molv-btn-orange" (click)="edit()">{{ 'edit' | transloco }}</button>
        }
        @else {
        <button class="molv-btn molv-btn-pink" (click)="cancel()">{{ 'cancel' | transloco }}</button>
        <button class="molv-btn molv-btn-green" (click)="save()">{{ 'save' | transloco }}</button>
        <button class="molv-btn molv-btn-red" (click)="delete()">{{ 'delete' | transloco }}</button>
        }
      </div>
    </div>
  </div>

  <movl-chapter-list [activeManga]="activeManga"></movl-chapter-list>
</div>
