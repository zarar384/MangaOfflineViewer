<reader-settings-window
  [isVisible]="showSettingsWindow" 
  (hideWindow)="onSettingsWindowHide()"
  (saveBookmarkClicked)="saveBookmark()"
  (goToBookmarkClicked)="goToBookmark($event)"
  (exportButtonClicked)="onExportButtonClicked($event)"
  [bookmarks]="bookmarks"
  [(gapLevel)]="gap"
  [(mode)]="mode"
  [(zoomLevel)]="zoom"
  [(downloadMod)]="downloadMod"
  [(selectedBookmarkId)]="selectedBookmarkId"
>
</reader-settings-window>

<div class="reader-container-wrapper">
  <manga-reader
    [pages]="pages"
    [gap]="gap"
    [mode]="mode"
    [zoom]="zoom">
  </manga-reader>
</div>
