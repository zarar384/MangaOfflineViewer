<div class="reader-container"
     tabindex="0"
     #readerContainer
     [class.page-mode]="readerMode === 'page'"
     [class.scroll-mode]="readerMode === 'scroll'"
     [class.horizontal-mode]="readerMode === 'horizontal'"
     [class.dual-mode]="readerMode === 'dual'"
     [class.dual-cover]="readerMode === 'dual' && dualPageCover">

  @for (page of visiblePages; track page.id) {
    <div class="image-container"
         [class.cover-page]="page.id === pages[0]?.id"
         [style.margin-right]="readerMode === 'dual' && page.id === pages[pages.length - 1]?.id && (pages.length - (dualPageCover ? 1 : 0)) % 2 === 1 ? '50%' : null"
         [style.margin-bottom.px]="readerMode === 'scroll' ? readerGap : 0">

      <img
        #imgRef
        class="reader-img"
        [attr.width]="page.width || null"
        [attr.height]="page.height || null"
        [style.aspect-ratio]="readerMode === 'scroll' && page.width && page.height ? page.width + ' / ' + page.height : null"
        [style.height.px]="readerMode === 'scroll' && !(page.width && page.height) ? 0 : null"
        [attr.data-page-id]="page.id"
        [alt]="'page ' + page.id"
      />
    </div>
  }

</div>
