<app-window
  [visible]="isVisible"
  title="Import Mangas"
  [width]="'500px'"
  [height]="'400px'"
  position="center"
  [showClose]="true"
  [closeDisabled]="filesProcessing"
  [showHide]="false"
  (close)="onWindowClose()">
  <div class="molv-container">
    <input type="text" class="molv-txtbx" placeholder="Manga Name" [value]="fileName" [(ngModel)]="fileName" />
    <button class="molv-btn molv-btn-pink" (click)="saveAndClose()">Save</button>
    <molv-drop-uploader [visible]="isVisible" [tabId]="tabId" [saveAll$]="saveAll$" [clearAll$]="clearAll$"
      (onDropFinished)="onUploadFinished()" (filesProcessing)="filesProcessing = $event" (fileSelected)="fileName = fileName ?? $event"></molv-drop-uploader>
  </div>
</app-window>
