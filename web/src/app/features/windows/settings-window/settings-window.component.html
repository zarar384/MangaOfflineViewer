<app-window [visible]="isVisible" title="{{'settings' | transloco}}" [width]="'500px'" [height]="'400px'" position="center"
  [showClose]="true" [showHide]="false" [blockBackground]="true" [showTransparency]="false" (close)="onWindowClose()">
  <div>
    <div class="controls">
      <div class="setting-left">
        <span class="setting-label">{{'language' | transloco}}</span>
        <molv-dropdown [(value)]="language" (valueChange)="onLangChange($event)" [options]="[
            { value: supportedLangs.EN, label: 'ENG' },
            { value: supportedLangs.CS, label: 'CZ' },
            { value: supportedLangs.RU, label: 'RU' },
            { value: supportedLangs.ES, label: 'ES' }
          ]">
        </molv-dropdown>
      </div>
      <div class="setting-left">
        <span class="setting-label">{{'update' | transloco}}</span>
        <button class="molv-btn molv-btn-pink" [disabled]="!updateAvailable()" (click)="updateApp()"> {{'update' | transloco}} </button>
      </div>
      <div class="app-version" [title]="appVersion.buildId">
        <div>
          <span class="setting-label">{{'appVersion' | transloco}}:</span>
          <span>{{ appVersion.version }} · {{ appVersion.commit }}{{ appVersion.dirty ? '-dirty' : '' }}</span>
        </div>
        <div class="build-date">
          {{'buildDate' | transloco}}:
          <time [attr.datetime]="appVersion.builtAt">{{ appVersion.builtAt | date:'yyyy-MM-dd HH:mm:ss':'UTC' }} UTC</time>
        </div>
      </div>
    </div>
  </div>
</app-window>
