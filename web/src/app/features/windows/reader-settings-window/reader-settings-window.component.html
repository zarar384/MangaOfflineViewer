<app-window [visible]="isVisible" title="{{'settingsMangas' | transloco}}" [width]="'500px'" [height]="'400px'" position="bottom-right"
  [showClose]="false" [showHide]="true" [blockBackground]="false" [showTransparency]="true" (hide)="onWindowHide()">

  <molv-tabs [userTabs]="settingsTabs" [activeTabId]="activeTabId"
    (homeClicked)="onHomeTab()" (tabSelected)="onTabSelected($event)"></molv-tabs>

  <div class="tab-content">
    @if(activeTab === 'home')
    {
    <div class="controls">
      <div class="setting-right">
        <span class="setting-label">{{'gap' | transloco}}:</span>
        <molv-slider [min]="0" [max]="100" [step]="1" [(value)]="gap"></molv-slider>
      </div>

      <div class="setting-right">
        <span class="setting-label">{{'zoom' | transloco}}:</span>
        <molv-slider [min]="0.5" [max]="3" [step]="0.1" [(value)]="zoom"></molv-slider>
      </div>

      <div class="setting-left">
        <span class="setting-label">{{ mode === 'scroll' ? ('scrollMode' | transloco) : ('pageMode' | transloco) }}:</span>
        <molv-switch [(checked)]="modeIsPage"></molv-switch>
      </div>

      <div class="setting-left-group">
        <!-- go to page -->
        <div class="setting-left">
          <div class="setting-label">
            <molv-dropdown [options]="pageOptions" [(value)]="selectedPageId" placeholder="{{'select' | transloco}}">
            </molv-dropdown>
          </div>
          <button class="molv-btn molv-btn-pink" [disabled]="!selectedPageId" (click)="goToPage()">{{'go' | transloco}}</button>
        </div>

        <!-- bookmarks -->
        <div class="setting-left">
          <div class="setting-label">
            <molv-dropdown [options]="bookmarkOptions" [(value)]="selectedBookmarkId" placeholder="{{'select' | transloco}}">
            </molv-dropdown>
          </div>
          <button class="molv-btn molv-btn-pink" (click)="saveBookmark()">{{'save' | transloco}}</button>
          <button class="molv-btn molv-btn-pink" [disabled]="!selectedBookmarkId" (click)="goToBookmark()">{{'go' | transloco}}</button>
        </div>

        <!-- button to download tab-->
        <div class="setting-left">
          <div class="setting-label">
            <molv-dropdown [(value)]="dwnldMod" [options]="[
            { value: 'mhtml', label: 'MHTML' },
            { value: 'zip', label: 'ZIP' }
            ]" >
            </molv-dropdown>
          </div>
          <button class="molv-btn molv-btn-pink" (click)="export(dwnldMod)">{{'download' | transloco}}</button>
        </div>
      </div>
    </div>
    }
    @else {
    <div class="controls bookmarks-list">
      @for (bm of bookmarks; track $index) {
      <div style="display: flex; align-items: center; gap: 6px;">
        <molv-textbox [(value)]="bm.title!" placeholder="{{'bookmarkTitle' | transloco}}" [isEditMode]="isEditing(bm)"></molv-textbox>
        @if(isEditing(bm)) {
        <button class="molv-btn molv-btn-green" (click)="saveBookmarkEdit(bm)">
          {{'save' | transloco}}
        </button>
        <button class="molv-btn molv-btn-pink" (click)="cancelBookmarkEdit(bm)">
          {{'cancel' | transloco}}
        </button>
        }
        @else {
        <button class="molv-btn molv-btn-orange" (click)="startEditBookmark(bm)">
          {{'edit' | transloco}}
        </button>
        <button class="molv-btn-small-remove" (click)="deleteBookmark(bm)">
          ✕
        </button>
        }
      </div>
      }
    </div>
    }
  </div>
</app-window>
