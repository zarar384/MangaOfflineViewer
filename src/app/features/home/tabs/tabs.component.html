<div class="grid">
    @for (tabData of tabs; track tabData.tab.id) {
    <div class="card" (click)="openChapterInTab(tabData)">
        <div class="cover" [style.backgroundImage]="'url(' + tabData.previewUrl + ')'">
            <div class="cover-overlay">
                <div class="title">{{ tabData.tab.name }}</div>
            </div>
        </div>
        <div class="meta">
            <div class="meta-actions">Read →</div>
        </div>
    </div>
    }
</div>
