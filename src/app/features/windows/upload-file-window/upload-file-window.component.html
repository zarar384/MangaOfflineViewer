<app-window
  [visible]="isVisible"
  title="Import Mangas"
  [width]="'500px'"
  [height]="'400px'"
  position="center"
  [showClose]="true"
  [showHide]="false"
  (close)="onWindowClose()">
  <div>
    <drop-uploader [visible]="isVisible" (onFinished)="onUploadFinished()"></drop-uploader>
  </div>
</app-window>
