<div class="reader-container" [class.page-mode]="mode === 'page'" [class.scroll-mode]="mode === 'scroll'">

  @for (url of pageUrlsArray; track url.id) {
    <div class="image-container" 
         [style.zoom]="mode === 'scroll' ? zoom : 1"
         [style.margin-bottom.px]="mode === 'scroll' ? gap : 0">
      
      <img 
        #imgRef 
        class="reader-img" 
        [attr.data-src]="url.src" 
        [alt]="'page ' + url.id" 
      />
    </div>
  }
</div>
