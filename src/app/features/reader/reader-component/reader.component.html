<div class="reader-container" [class.page-mode]="mode === 'page'" [class.scroll-mode]="mode === 'scroll'">

  @for (src of pages; track $index)
  {
  <div class="image-container" [style.zoom]="mode === 'scroll' ? zoom : 1"
    [style.margin-bottom.px]="mode === 'scroll' ? gap : 0">

    <img #imgRef class="reader-img" [attr.data-src]="src" />
  </div>
  }
</div>
